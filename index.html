.bnav-item{flex:0 0 calc(100%/6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 4px;cursor:pointer;color:var(--muted);user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:color 0.15s,transform 0.12s;scroll-snap-align:start;position:relative;}
/* Items inside the scroll section resolve their % against .bnav-scroll (5/6 of the bar's
   width, since Home's slot takes the other 1/6) — so they need /5, not /6, to actually come
   out the same physical width as Home's slot instead of drifting wider or narrower. */
#bnavScroll.bnav-item,#bnavScroll .bnav-item{flex:0 0 calc(100%/5);}
/* Home's own item must fill its whole slot, not carve out yet another 1/6 fraction of the
   already-1/6-wide slot — that compounding was what shrank it to a sliver and let its icon
   and label spill outside the bar. */
#bnavHomeSlot .bnav-item{flex:1 1 auto;width:100%;}
.bnav-item:active{transform:scale(0.86);}
.bnav-item svg{display:block;width:27px;height:27px;position:relative;z-index:1;transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1);}
.bnav-item .bnav-label{font-size:0.64rem;font-weight:700;display:none;position:relative;z-index:1;}
.bnav-item.active{color:var(--accent);}
.bnav-item.active svg{transform:scale(1.08);}
.bnav-item.active::before{content:'';position:absolute;width:42px;height:34px;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--accent-glow);border-radius:12px;z-index:0;}
.bnav-item .bnav-ic-outline{display:block;}
.bnav-item .bnav-ic-filled{display:none;}
.bnav-item.active .bnav-ic-outline{display:none;}
.bnav-item.active .bnav-ic-filled{display:block;}
#topAvatarBtn{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--btn-passive);border:1.5px solid var(--btn-border);cursor:pointer;font-size:1rem;}
#topAvatarBtn svg,#topAvatarBtn img{width:100%;height:100%;}
#notifBellBtn{position:relative;width:34px;height:34px;padding:0;border-radius:50%;flex-shrink:0;}
#notifBellDot{display:none;position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:var(--warn);border:1.5px solid var(--bg);color:#fff;font-size:0.64rem;font-weight:800;line-height:13px;text-align:center;box-sizing:border-box;}
#notifBellDot.show{display:block;}
.fab-todo{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:210;width:52px;height:52px;border-radius:16px;background:var(--accent);border:1px solid var(--bg);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px var(--accent-glow);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform 0.15s;}
/* Second, optional Home-only button for jumping straight to the Timer page — sits stacked
   above the Plus button so both are reachable with the same thumb, but visually secondary
   (outlined, not filled) so Plus stays the obvious primary action. Toggleable in Settings —
   when off, Timer is only reachable through the Plus button's own action list instead. */
.fab-timer{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom) + 64px);z-index:208;width:52px;height:52px;border-radius:16px;background:var(--card-bg);border:1.5px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,0.25);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform 0.15s;}
.fab-timer:active{transform:scale(0.92);}
.fab-timer svg{width:22px;height:22px;}
.fab-todo.speed-open{transform:rotate(45deg);}
.fab-speed-backdrop{display:none;position:fixed;inset:0;z-index:205;background:rgba(0,0,0,0.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
.fab-speed-backdrop.open{display:block;}
.fab-speed-menu{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom) + 62px);z-index:209;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.fab-speed-item{display:none;align-items:center;gap:10px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;}
.fab-speed-menu.open .fab-speed-item{display:flex;animation:fabSpeedIn 0.18s cubic-bezier(0.2,0.8,0.4,1) backwards;}
.fab-speed-menu.open .fab-speed-item:nth-child(1){animation-delay:0.06s;}
.fab-speed-menu.open .fab-speed-item:nth-child(2){animation-delay:0.045s;}
.fab-speed-menu.open .fab-speed-item:nth-child(3){animation-delay:0.03s;}
.fab-speed-menu.open .fab-speed-item:nth-child(4){animation-delay:0.015s;}
.fab-speed-menu.open .fab-speed-item:nth-child(5){animation-delay:0s;}
@keyframes fabSpeedIn{from{opacity:0;transform:translateY(8px) scale(0.94);}to{opacity:1;transform:translateY(0) scale(1);}}
.fab-speed-label{background:var(--card-bg);border:1px solid var(--card-border);color:var(--text);font-size:0.78rem;font-weight:700;padding:0 14px;border-radius:20px;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.3);width:128px;height:44px;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;}
.fab-speed-ic{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:var(--card-bg);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 4px 16px rgba(0,0,0,0.3);transition:transform .12s ease,background .12s ease,border-color .12s ease,box-shadow .12s ease;}
.fab-speed-ic svg{width:20px;height:20px;}
